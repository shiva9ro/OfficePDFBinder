name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check Qt translation catalog is current
        run: |
          pyside6-lupdate OfficePDFBinder_Main.py -ts translations/OfficePDFBinder_en.ts -source-language ja_JP -target-language en_US
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          git diff --exit-code -- translations/OfficePDFBinder_en.ts
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Qt translation catalog is out of date. Run pyside6-lupdate and commit the updated .ts file."
            exit 1
          }

      - name: Compile Qt translations
        run: >
          pyside6-lrelease
          translations/OfficePDFBinder_en.ts
          -qm translations/OfficePDFBinder_en.qm
          -nounfinished

      - name: Build native test dependencies (x64 and ARM64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/build_shell_bridge.ps1 -Tests
          ./scripts/build_shell_bridge.ps1 -IntegrationServer
          ./scripts/build_sparse_package.ps1 -Architectures x64,arm64

      - name: Require native test dependencies
        shell: pwsh
        run: |
          $required = @(
            'native/shell_bridge/out.build/shell_bridge_test.exe',
            'native/shell_bridge/out.build/shell_bridge_integration.exe',
            'native/shell_bridge/sparse.build/x64/OfficePDFBinder_Explorer.dll',
            'native/shell_bridge/sparse.build/x64/OfficePDFBinder.ContextMenu.msix',
            'native/shell_bridge/sparse.build/arm64/OfficePDFBinder_Explorer.dll',
            'native/shell_bridge/sparse.build/arm64/OfficePDFBinder.ContextMenu.msix',
            'native/shell_bridge/sparse.build/OfficePDFBinder.ContextMenu.cer'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Native test dependency is missing: $path"
            }
          }

      - name: Run tests
        run: python -m pytest --junitxml=tests/artifacts/pytest.xml

      - name: Reject skipped shell integration tests
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$report = Get-Content -LiteralPath tests/artifacts/pytest.xml -Raw
          $cases = @($report.SelectNodes('//testcase') | Where-Object {
            $_.classname -match '(^|\.)(test_ipc_regressions|test_explorer_command|test_shell_registration)$'
          })
          if ($cases.Count -eq 0) { throw 'No shell integration tests were reported.' }
          foreach ($case in $cases) {
            if ($null -ne $case.SelectSingleNode('skipped')) {
              throw "Shell integration test was skipped: $($case.classname).$($case.name)"
            }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: tests/artifacts/pytest.xml
          if-no-files-found: warn
